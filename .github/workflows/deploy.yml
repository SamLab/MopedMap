name: Deploy map to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate map
        run: python mopedmap.py
        env:
          OUTPUT_FILE: index.html

      - name: Prepare deployment files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r README.html _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for sha in "${{ github.event.before }}" "${{ github.sha }}" $(git log --format=%H -5 2>/dev/null); do
            [ -z "$sha" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" --silent 2>/dev/null || true
          done
          echo "Done cancelling stuck deployments"

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
